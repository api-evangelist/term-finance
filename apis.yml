name: Term Finance
description: >-
  Term Finance is a noncustodial, fixed-rate lending and borrowing protocol for
  crypto assets, modeled on the tri-party repo arrangements common in traditional
  finance (TradFi). Liquidity suppliers and takers are matched through a weekly
  blind double-auction that aggregates bids and offers into a single
  market-clearing rate, while collateral backing each loan sits in isolated,
  non-rehypothecatable smart contracts known as repoLockers. The protocol is
  deployed across Ethereum, Avalanche, Base, BNB Smart Chain and Plasma, and its
  Solidity contracts have been audited by Sigma Prime, Runtime Verification,
  Dedaub and Certora. Term Finance is developer-facing primarily through on-chain
  smart contracts and a Solidity API reference rather than a hosted REST API.
